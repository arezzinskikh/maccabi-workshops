version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: maccabi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-maccabi_workshops}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      DATABASE_NAME: ${DATABASE_NAME:-maccabi_workshops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER"']
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: maccabi_strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-maccabi_workshops}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-admin-32-chars}
      APP_KEYS: ${APP_KEYS:-key1,key2,key3,key4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-change-me-token-salt}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-change-me-transfer-salt}
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/app/public/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maccabi_frontend
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-http://cms:1337}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-admin-pass}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET:-changeme-admin-cookie-secret-32chars}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  strapi_uploads:
